server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /portfolio/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /portfolio/ {
        rewrite ^/portfolio/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}